<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carte — Suivi de candidatures</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%231a1a1a'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='700' font-size='20' fill='%23C9A84C' letter-spacing='1'>JOB</text></svg>"/>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <!-- Leaflet.js (la carte) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f5f4f1;color:#1a1a1a;font-size:13px;display:flex;flex-direction:column}

    /* FIXED HEADER */
    #fixed-header{position:fixed;top:0;left:0;right:0;z-index:1000}

    /* NAV */
    nav{background:#111;display:flex;gap:0;border-bottom:1px solid #333;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
    nav::-webkit-scrollbar{display:none}
    nav a{color:#ccc;text-decoration:none;padding:.75rem 1.5rem;font-size:.82rem;letter-spacing:.05em;text-transform:uppercase;font-weight:600;transition:background .15s,color .15s;white-space:nowrap;flex-shrink:0}
    nav a:hover,nav a.active{background:#fff;color:#111}

    /* SOUS-EN-TÊTE */
    .subhdr{background:#1a1a1a;color:#fff;padding:.8rem 1.5rem;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;border-bottom:1px solid #333}
    .subhdr h1{font-size:.95rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
    .subhdr p{font-size:.75rem;color:#888}

    /* LOADING */
    #loading-screen{position:fixed;inset:0;background:#f5f4f1;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;color:#666;font-size:.85rem}
    .spinner{width:32px;height:32px;border:3px solid #ddd;border-top-color:#1a1a1a;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* CONTROLS BAR */
    .map-controls{background:#fff;border-bottom:1px solid #e5e5e5;padding:.6rem 1.5rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
    #map-search{border:1px solid #ddd;border-radius:6px;padding:.4rem .7rem;font-size:.8rem;width:200px}
    #map-search:focus{outline:none;border-color:#1a1a1a}
    #ag-count{font-size:.75rem;color:#888;margin-left:auto}

    /* MAP */
    #map-area{position:fixed;left:0;right:0;bottom:0}

    /* LEGEND */
    .map-legend{background:#fff;border-radius:8px;padding:.75rem 1rem;font-size:.72rem;line-height:1.9;box-shadow:0 2px 8px rgba(0,0,0,.12)}
    .map-legend b{display:block;margin-bottom:.3rem;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:#555}
    .leg-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:.4rem;vertical-align:middle}

    /* POPUP */
    .leaflet-popup-content-wrapper{border-radius:10px !important;box-shadow:0 4px 16px rgba(0,0,0,.15) !important}
    .leaflet-popup-content{margin:10px 14px !important;font-family:'Segoe UI',system-ui,sans-serif;font-size:12px;line-height:1.6}
    .popup-name{font-weight:700;font-size:.88rem;margin-bottom:.35rem;color:#1a1a1a}
    .popup-row{color:#555;margin:.1rem 0}
    .popup-row a{color:#1d4ed8;text-decoration:none}
    .popup-row a.mail{color:#7c3aed}
    .popup-row a:hover{text-decoration:underline}
    .popup-status{display:inline-block;border-radius:5px;padding:.2rem .5rem;font-size:.72rem;font-weight:600;margin-top:.35rem}

    /* MOBILE */
    @media(max-width:700px){
      nav a{padding:.55rem .9rem;font-size:.72rem}
      .subhdr{padding:.6rem .75rem}
      .subhdr p{display:none}
      .map-controls{padding:.45rem .75rem;gap:.4rem}
      #map-search{width:130px}
    }
  </style>
</head>
<body>

<div id="loading-screen">
  <div class="spinner"></div>
  <p>Chargement…</p>
</div>

<div id="fixed-header">
  <nav>
    <a href="carte.html" class="active">🗺️ Carte</a>
    <a href="index.html">📊 Tableau de suivi</a>
    <a href="modele-mail.html">📧 Modèle mail</a>
  </nav>
  <div class="map-controls">
    <input type="text" id="map-search" placeholder="Rechercher une entreprise…" oninput="filterSearch(this.value)"/>
    <span id="ag-count"></span>
  </div>
</div>

<div id="map-area"></div>

<script>
// ═══════════════════════════════════════════════════
// FIREBASE
// ═══════════════════════════════════════════════════
// La configuration Firebase est dans le fichier firebase-config.js
if (!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith('COLLE')) {
  document.getElementById('loading-screen').innerHTML =
    '<p style="max-width:320px;text-align:center;line-height:1.6">⚠️ Firebase n\'est pas encore configuré.<br>Colle ta configuration dans le fichier <b>firebase-config.js</b>.</p>';
  throw new Error('Configuration Firebase manquante');
}
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COL = 'prospection';

// ═══════════════════════════════════════════════════
// STATUTS (mêmes que le tableau de suivi)
// ═══════════════════════════════════════════════════
const STATUSES = {
  nc:{label:'Non contacté'}, em:{label:'Email envoyé'}, r1:{label:'Relance 1'}, r2:{label:'Relance 2'},
  rp:{label:'Réponse reçue'}, en:{label:'Entretien'}, ok:{label:'Poste obtenu ✓'}, rf:{label:'Refus'},
};
const ST_COLORS = {
  nc:'#9ca3af', em:'#3b82f6', r1:'#f59e0b', r2:'#f97316',
  rp:'#14b8a6', en:'#8b5cf6', ok:'#10b981', rf:'#d1d5db'
};

// ═══════════════════════════════════════════════════
// OUTILS
// ═══════════════════════════════════════════════════
function esc(t) {
  return String(t || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const wait = ms => new Promise(r => setTimeout(r, ms));

// ═══════════════════════════════════════════════════
// CARTE + MARQUEURS
// ═══════════════════════════════════════════════════
let map, allMarkers = [], entreprises = [], activeSearch = '';

// Transforme une adresse ou une ville en coordonnées (service gratuit OpenStreetMap)
async function geocode(lieu) {
  try {
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(lieu + ', France')}&format=json&limit=1`;
    const r = await fetch(url, {headers: {'Accept-Language': 'fr'}});
    const j = await r.json();
    if (j.length) return [parseFloat(j[0].lat), parseFloat(j[0].lon)];
  } catch(e) {}
  return null;
}

function makeIcon(status) {
  const color = ST_COLORS[status] || '#9ca3af';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="34" viewBox="0 0 26 34">
    <path d="M13 0C5.82 0 0 5.82 0 13c0 9 13 21 13 21s13-12 13-21C26 5.82 20.18 0 13 0z" fill="${color}" stroke="#fff" stroke-width="2"/>
    <circle cx="13" cy="13" r="4" fill="#fff" fill-opacity="0.35"/>
  </svg>`;
  return L.divIcon({html: svg, className: '', iconSize: [26, 34], iconAnchor: [13, 34], popupAnchor: [0, -34]});
}

function popupHtml(ag) {
  const st = STATUSES[ag.status] ? ag.status : 'nc';
  const phone = ag.phone ? `<div class="popup-row">📞 <a href="tel:${esc(ag.phone)}">${esc(ag.phone)}</a></div>` : '';
  const mail  = ag.email ? `<div class="popup-row">✉ <a href="mailto:${esc(ag.email)}" class="mail">${esc(ag.email)}</a></div>` : '';
  const site  = ag.site  ? `<div class="popup-row">🌐 <a href="https://${esc(ag.site)}" target="_blank">${esc(ag.site)}</a></div>` : '';
  const notes = ag.notes ? `<div class="popup-row" style="color:#666;font-style:italic;margin-top:.4rem">${esc(ag.notes)}</div>` : '';
  return `
    <div class="popup-name">${esc(ag.name)}</div>
    <div class="popup-row" style="color:#888">${esc(ag.address || ag.city)}</div>
    ${phone}${mail}${site}${notes}
    <span class="popup-status" style="background:${ST_COLORS[st]}22;color:${ST_COLORS[st]}">${STATUSES[st].label}</span>`;
}

function addMarker(ag) {
  // Décale légèrement les entreprises qui ont exactement le même point
  const same = allMarkers.filter(m => m.base === ag._lat + ',' + ag._lng).length;
  const angle = same * 2.4, r = same ? same * 0.0018 : 0;
  const marker = L.marker([ag._lat + r * Math.cos(angle), ag._lng + r * Math.sin(angle)], {icon: makeIcon(ag.status)});
  marker.bindPopup(popupHtml(ag), {maxWidth: 280});
  allMarkers.push({marker, ag, base: ag._lat + ',' + ag._lng});
  applyFilters();
}

function applyFilters() {
  let visible = 0;
  allMarkers.forEach(({marker, ag}) => {
    const ok = !activeSearch
      || ag.name.toLowerCase().includes(activeSearch)
      || (ag.city || '').toLowerCase().includes(activeSearch);
    if (ok) { marker.addTo(map); visible++; } else marker.remove();
  });
  document.getElementById('ag-count').textContent =
    `${visible} entreprise${visible > 1 ? 's' : ''} affichée${visible > 1 ? 's' : ''}`;
}

function filterSearch(val) {
  activeSearch = val.toLowerCase().trim();
  applyFilters();
}

function zoomOnMarkers() {
  if (!allMarkers.length) return;
  map.fitBounds(L.latLngBounds(allMarkers.map(m => m.marker.getLatLng())), {padding: [40, 40], maxZoom: 13});
}

// ═══════════════════════════════════════════════════
// MISE EN PAGE
// ═══════════════════════════════════════════════════
function adjustLayout() {
  const h = document.getElementById('fixed-header').offsetHeight;
  document.getElementById('map-area').style.top = h + 'px';
  if (map) map.invalidateSize();
}
window.addEventListener('resize', adjustLayout);

// ═══════════════════════════════════════════════════
// DÉMARRAGE
// ═══════════════════════════════════════════════════
async function init() {
  adjustLayout();
  map = L.map('map-area', {zoomControl: true}).setView([46.6, 2.5], 6);  // France entière
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 18,
  }).addTo(map);

  // Légende des couleurs
  const legend = L.control({position: 'bottomright'});
  legend.onAdd = () => {
    const div = L.DomUtil.create('div', 'map-legend');
    div.innerHTML = '<b>Statut</b>' + Object.keys(STATUSES).map(k =>
      `<div><span class="leg-dot" style="background:${ST_COLORS[k]}"></span>${STATUSES[k].label}</div>`).join('');
    return div;
  };
  legend.addTo(map);

  // Charger les entreprises du tableau de suivi
  try {
    const snap = await userCol(COL).get();
    snap.forEach(doc => {
      const d = doc.data();
      if (d._hidden || !d._custom) return;
      entreprises.push({
        id: doc.id,
        name: d.name ?? d._name ?? '',
        city: d.city ?? d._city ?? '',
        address: d.address ?? '',
        phone: d.phone ?? d._phone ?? '',
        email: d.email ?? d._email ?? '',
        site: d.site ?? d._site ?? '',
        notes: d.notes || '',
        status: d.status || 'nc',
        _lat: d._lat, _lng: d._lng,
      });
    });
  } catch(e) { console.warn('Firebase indisponible :', e); }

  document.getElementById('loading-screen').style.display = 'none';
  adjustLayout();

  // 1. Afficher tout de suite celles dont la position est déjà connue
  entreprises.filter(ag => ag._lat && ag._lng).forEach(addMarker);
  zoomOnMarkers();
  applyFilters();

  // 2. Chercher la position des autres (adresse précise, sinon ville), une par seconde
  for (const ag of entreprises.filter(ag => !(ag._lat && ag._lng))) {
    const lieu = ag.address || ag.city;
    if (!lieu) continue;
    const coords = await geocode(lieu);
    if (coords) {
      [ag._lat, ag._lng] = coords;
      userCol(COL).doc(ag.id).set({_lat: coords[0], _lng: coords[1]}, {merge: true});  // mémorisé pour la prochaine fois
      addMarker(ag);
      zoomOnMarkers();
    }
    await wait(1100);
  }
}

requireAuth(init);
</script>
</body>
</html>
